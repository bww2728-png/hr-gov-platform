<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>منصة الناضج — لا يوجد اتصال</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",Tahoma,sans-serif;background:linear-gradient(160deg,#1E1B4B,#312E81);color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}
  .card{text-align:center;max-width:460px;padding:40px}
  .icon{width:84px;height:84px;border-radius:22px;background:#4338CA;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 22px}
  h1{font-size:22px;margin-bottom:10px}
  p{color:#C7D2FE;font-size:14px;line-height:1.8;margin-bottom:26px}
  button{background:#4F46E5;color:#fff;border:0;padding:12px 38px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{background:#6366F1}
  .hint{margin-top:18px;font-size:12px;color:#818CF8}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذّر الوصول إلى منصة الناضج.<br>تحقق من اتصالك بالشبكة ثم أعد المحاولة —<br>بياناتك آمنة في السحابة وستعود فور عودة الاتصال.</p>
    <button onclick="desktop.retryConnection()">إعادة المحاولة</button>
    <div class="hint">منصة الناضج لإدارة الموارد البشرية</div>
  </div>
</body>
</html>
